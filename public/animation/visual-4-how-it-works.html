<!-- Visual 4: How It Works — SocraticMetric™ -->
<!-- Placement: Homepage steps section · All solution pages -->
<!-- Hook: "3,000 people verified simultaneously. No examiner. No scheduling. No guessing." -->
<!-- Self-contained, no dependencies. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SM Visual 4 — How It Works</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px 12px 12px; background: transparent; font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: min-content; }
  @media (min-width: 640px) { body { padding: 16px 20px 14px; } }
  @media (max-width: 640px) {
    .steps-grid { grid-template-columns: 1fr !important; gap: 28px !important; padding: 20px 16px 28px !important; }
    .step-connector { display: none !important; }
    .sm-step-box { min-height: auto !important; padding: 20px 14px !important; }
  }
  @keyframes sm-step { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  @keyframes sm-conn { from{width:0} to{width:100%} }
  @keyframes sm-mic  { 0%{transform:scale(1);opacity:.5} 100%{transform:scale(1.8);opacity:0} }
  @keyframes sm-wv   { 0%{height:3px} 100%{height:var(--h,18px)} }
  @keyframes sm-ring { from{stroke-dashoffset:150} to{stroke-dashoffset:var(--o,27)} }
  @keyframes sm-file { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
  .sm-step { animation:sm-step .5s ease forwards;opacity:0 }
  .sm-conn { animation:sm-conn .6s ease forwards;width:0;overflow:hidden }
  .sm-mr   { position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #E24B4A;animation:sm-mic 1.3s ease-out infinite }
  .sm-mr2  { position:absolute;inset:-10px;border-radius:50%;border:1px solid #E24B4A;animation:sm-mic 1.3s ease-out infinite .5s }
  .sm-wb   { width:3px;border-radius:2px;background:#378ADD;animation:sm-wv var(--d,.7s) ease-in-out infinite alternate }
  .sm-arc  { animation:sm-ring 1.3s ease forwards .3s;stroke-dashoffset:150 }
  .sm-fi   { animation:sm-file .4s ease forwards;opacity:0 }
</style>
</head>
<body>
<div style="background:#fff;border-radius:24px;border:0.5px solid #e0dfd8;overflow:hidden;width:100%;max-width:880px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,0.05)">
  <div style="height:48px;background:#f8f8f7;border-bottom:0.5px solid #e0dfd8;display:flex;align-items:center;padding:0 20px;gap:8px">
    <div style="width:14px;height:14px;border-radius:50%;background:#ff5f57"></div>
    <div style="width:14px;height:14px;border-radius:50%;background:#febc2e"></div>
    <div style="width:14px;height:14px;border-radius:50%;background:#28c840"></div>
    <span style="margin-left:14px;font-size:14px;color:#888780">How it works — three steps</span>
  </div>
  <div class="steps-grid" style="padding:40px 24px 40px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;gap:20px">

    <!-- Step 1 -->
    <div class="sm-step" style="animation-delay:.1s;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
      <div style="width:48px;height:48px;border-radius:50%;background:#2c2c2a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#fff">1</div>
      <div class="sm-step-box" style="width:100%;background:#f8f8f7;border-radius:12px;border:0.5px solid #e0dfd8;padding:20px;min-height:140px;display:flex;flex-direction:column;gap:10px;align-items:center">
        <div style="width:100%;border:1.5px dashed #D3D1C7;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px" id="sm-fl">
          <svg width="24" height="24" viewBox="0 0 18 18" fill="none">
            <path d="M9 12V3M9 3L5.5 6.5M9 3L12.5 6.5" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 13v2a1 1 0 001 1h12a1 1 0 001-1v-2" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div style="font-size:15px;font-weight:500;color:#2c2c2a">Curate content</div>
      <div style="font-size:13px;color:#5F5E5A;line-height:1.5">Upload course materials, policies, or operational doctrine</div>
    </div>

    <!-- Connector 1 -->
    <div class="step-connector" style="display:flex;align-items:flex-start;padding-top:70px;justify-content:center">
      <div class="sm-conn" style="animation-delay:.6s;height:1px;background:#D3D1C7;width:30px"></div>
    </div>

    <!-- Step 2 -->
    <div class="sm-step" style="animation-delay:.4s;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
      <div style="width:48px;height:48px;border-radius:50%;background:#2c2c2a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#fff">2</div>
      <div class="sm-step-box" style="width:100%;background:#f8f8f7;border-radius:12px;border:0.5px solid #e0dfd8;padding:20px;min-height:140px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center">
        <div style="position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center">
          <div class="sm-mr"></div>
          <div class="sm-mr2"></div>
          <div style="width:56px;height:56px;border-radius:50%;background:#E24B4A;display:flex;align-items:center;justify-content:center;position:relative;z-index:1">
            <svg width="18" height="20" viewBox="0 0 14 16" fill="none">
              <rect x="4.5" y="0.5" width="5" height="9" rx="2.5" fill="white"/>
              <path d="M1 8c0 3.31 2.69 6 6 6s6-2.69 6-6" stroke="white" stroke-width="1.3" fill="none" stroke-linecap="round"/>
              <line x1="7" y1="14" x2="7" y2="15.5" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div id="sm-wf2" style="display:flex;align-items:center;gap:3px;height:26px"></div>
      </div>
      <div style="font-size:15px;font-weight:500;color:#2c2c2a">Conduct oral session</div>
      <div style="font-size:13px;color:#5F5E5A;line-height:1.5">AI presents adaptive questions; user responds aloud</div>
    </div>

    <!-- Connector 2 -->
    <div class="step-connector" style="display:flex;align-items:flex-start;padding-top:70px;justify-content:center">
      <div class="sm-conn" style="animation-delay:.9s;height:1px;background:#D3D1C7;width:30px"></div>
    </div>

    <!-- Step 3 -->
    <div class="sm-step" style="animation-delay:.7s;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
      <div style="width:48px;height:48px;border-radius:50%;background:#2c2c2a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#fff">3</div>
      <div class="sm-step-box" style="width:100%;background:#f8f8f7;border-radius:12px;border:0.5px solid #e0dfd8;padding:20px;min-height:140px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center">
        <div style="position:relative;width:76px;height:76px">
          <svg width="76" height="76" viewBox="0 0 60 60" style="transform:rotate(-90deg)">
            <circle cx="30" cy="30" r="24" fill="none" stroke="#e0dfd8" stroke-width="4.5"/>
            <circle class="sm-arc" cx="30" cy="30" r="24" fill="none" stroke="#1D9E75"
                    stroke-width="4.5" stroke-linecap="round" stroke-dasharray="150" style="--o:27"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
            <span id="sm-rn" style="font-size:20px;font-weight:500;color:#2c2c2a">0</span>
          </div>
        </div>
        <div style="font-size:12px;color:#888780">Audit record generated</div>
      </div>
      <div style="font-size:15px;font-weight:500;color:#2c2c2a">Verify &amp; score</div>
      <div style="font-size:13px;color:#5F5E5A;line-height:1.5">Platform evaluates reasoning depth and produces audit-ready records</div>
    </div>

  </div>
</div>

<script>
(function () {
  /* File list */
  var files = [
    { n: 'course-module.pdf',     c: '#E24B4A' },
    { n: 'retention-policy.docx', c: '#185FA5' },
    { n: 'ops-doctrine.pdf',      c: '#E24B4A' }
  ];
  var fl = document.getElementById('sm-fl');
  files.forEach(function (f, i) {
    var d = document.createElement('div');
    d.className = 'sm-fi';
    d.style.cssText = 'animation-delay:' + (.3 + i * .18) + 's;display:flex;align-items:center;gap:5px;padding:3px 6px;background:#fff;border-radius:4px;border:0.5px solid #e0dfd8;width:100%';
    d.innerHTML = '<div style="width:6px;height:6px;border-radius:1px;background:' + f.c + ';flex-shrink:0"></div>'
      + '<span style="font-size:9px;color:#5F5E5A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + f.n + '</span>';
    fl.appendChild(d);
  });
  /* Waveform */
  var wf2 = document.getElementById('sm-wf2');
  [4,9,16,12,20,17,10,22,14,9,18,13,16,8,20,13].forEach(function (h, i) {
    var b = document.createElement('div');
    b.className = 'sm-wb';
    b.style.cssText = '--h:' + h + 'px;--d:' + ((.4 + i * .045).toFixed(2)) + 's;height:' + h + 'px;animation-delay:' + ((i * .055).toFixed(2)) + 's';
    wf2.appendChild(b);
  });
  /* Score ring count-up */
  setTimeout(function () {
    var n = 0;
    var t = setInterval(function () {
      n = Math.min(n + 2, 82);
      document.getElementById('sm-rn').textContent = n;
      if (n >= 82) clearInterval(t);
    }, 22);
  }, 1000);
})();
</script>
</body>
</html>
